<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Task Management</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 850px; margin: 50px auto; padding: 0 20px; color: #243247; background: #f4f7fb; }
    main { background: white; padding: 32px; border-radius: 12px; }
    h1 { color: #1456a0; } li { margin: 10px 0; }
    code { background: #edf2f8; padding: 3px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Employee Task Management</h1>
    <p>This page is served using Node.js's built-in <code>fs</code> module.</p>
    <h2>HTTP Server Routes</h2>
    <ul>
      <li><code>GET /</code> – Welcome page</li>
      <li><code>GET /tasks</code> – Get all tasks</li>
      <li><code>POST /add-task</code> – Add a task</li>
      <li><code>GET /about</code> – About the application</li>
      <li><code>GET /home</code> – This HTML page</li>
    </ul>
    <p>Server address: <strong>http://localhost:3000</strong></p>
  </main>
</body>
</html>
